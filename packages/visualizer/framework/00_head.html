<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vela Visualizer</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 -apple-system, "Segoe UI", Inter, system-ui, sans-serif; color: #eef; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
        padding: 10px 12px; border-radius: 18px; background: rgba(14,16,26,.55); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid rgba(255,255,255,.09); box-shadow: 0 18px 50px -12px rgba(0,0,0,.7); transition: opacity .5s, transform .5s; width: max-content; max-width: calc(100vw - 40px); }
  #ui.hide { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  .grp { display: flex; gap: 4px; padding: 0 4px; flex-wrap: wrap; justify-content: center; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,.12); }
  .brk { flex-basis: 100%; height: 0; }
  button { all: unset; cursor: pointer; padding: 7px 11px; border-radius: 11px; color: #cfd3ea; font-weight: 600; font-size: 13px; letter-spacing: .01em; transition: background .15s, color .15s; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.08); color: #fff; }
  button.on { background: rgba(255,255,255,.92); color: #0b0d16; }
  #modes { max-width: min(1180px, calc(100vw - 70px)); }
  #modes button { padding: 5px 9px; font-size: 12px; }
  button kbd { font: inherit; font-size: 10px; opacity: .45; margin-right: 5px; }
  input[type=range] { width: 92px; accent-color: #b9a6ff; }
  #now { position: fixed; left: 26px; top: 22px; font-weight: 650; letter-spacing: .02em; opacity: .72; transition: opacity .5s; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #now small { display: block; font-weight: 500; opacity: .7; font-size: 12px; }
  #now.hide { opacity: 0; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(40,30,80,.55), rgba(0,0,0,.92)); z-index: 5; }
  #start .card { text-align: center; }
  #start h1 { font-weight: 300; font-size: 44px; letter-spacing: .02em; margin: 0 0 6px; }
  #start p { opacity: .65; margin: 0 0 26px; }
  #start .row { display: flex; gap: 10px; justify-content: center; }
  #start button { padding: 12px 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); }
  #start button.primary { background: #fff; color: #0b0d16; border-color: #fff; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20,14,50,.6); border: 2px dashed rgba(255,255,255,.4); font-size: 22px; z-index: 6; }
  #drop.show { display: grid; }
  #help { position: fixed; right: 24px; top: 22px; font-size: 12px; opacity: .5; text-align: right; transition: opacity .5s; pointer-events: none; }
  #help.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="now"></div>
<div id="help">← → scenes · 1–9, 0 jump · C colours · A auto-cycle · Space play/pause · F full screen · H hide</div>
<div id="ui">
  <div class="grp" id="modes"></div>
  <div class="brk"></div>
  <div class="grp">
    <button id="bDemo">Demo</button>
    <button id="bFile">File…</button>
    <button id="bMic">Mic</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="bCycle" title="Auto-cycle scenes (A)">Cycle</button>
    <button id="bPal" title="Next palette (C)">Colour: Auto</button>
    <button id="bFs" title="Full screen (F)">⤢</button>
  </div>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" title="Volume">
</div>
<div id="start"><div class="card">
  <h1>Vela Visualizer</h1>
  <p>Drop an audio file anywhere, use your microphone, or start the built-in demo.</p>
  <div class="row"><button class="primary" id="sDemo">Start demo</button><button id="sFile">Open a file</button><button id="sMic">Use microphone</button></div>
</div></div>
<div id="drop">Drop audio to play</div>
<input id="file" type="file" accept="audio/*,video/*" hidden>
<audio id="media" crossorigin="anonymous" hidden></audio>

'use strict';
