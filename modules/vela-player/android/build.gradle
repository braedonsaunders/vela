// Android has one playback engine: Media3 with its LGPL FFmpeg audio renderer, plus libdovi (MIT) for
// Dolby Vision Profile 7 to 8.1 conversion, and libass (ISC) for styled ASS/SSA subtitles.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.ether.vela'
version = '0.1.0'

def media3Version = '1.11.1'
def ffmpegDir = file(project.findProperty('velaMedia3Dir')
  ?: "${System.getProperty('user.home')}/.scratch/vela-build/media3/${media3Version}/libraries/decoder_ffmpeg/src/main")
def doviDir = file(project.findProperty('velaDoviDir')
  ?: "${System.getProperty('user.home')}/.scratch/vela-build/dovi/3.4.0")
def assDir = file(project.findProperty('velaAssDir') ?: "${System.getProperty('user.home')}/.scratch/vela-build/ass/1")
def supportedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
def requestedAbis = (project.findProperty('reactNativeArchitectures') ?: supportedAbis.join(',')).split(',')
requestedAbis.each { abi ->
  if (!supportedAbis.contains(abi) || !new File(ffmpegDir, "jni/ffmpeg/android-libs/${abi}/libavcodec.a").exists()) {
    throw new GradleException("Build the LGPL Media3 audio extension for ${abi} with modules/vela-player/android/ffmpeg/build.sh first")
  }
  if (!new File(doviDir, "${abi}/libdolby_vision.a").exists()) {
    throw new GradleException("Build libdovi for ${abi} with modules/vela-player/android/dovi/build.sh first")
  }
  if (!new File(assDir, "${abi}/lib/libass.a").exists()) {
    throw new GradleException("Build libass for ${abi} with modules/vela-player/android/ass/build.sh first")
  }
}

def visualizerAssets = tasks.register('copyVisualizerAssets', Sync) {
  from('../ios/VisualizerAssets/viz-native.js')
  into(layout.buildDirectory.dir('generated/visualizerAssets/vela-visualizer'))
}
tasks.named('preBuild').configure { dependsOn(visualizerAssets) }

android {
  buildFeatures { prefab true }
  sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/visualizerAssets'))
  namespace 'app.ether.vela.player'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
    ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    externalNativeBuild {
      cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DVELA_MEDIA3_DIR=${ffmpegDir}", "-DVELA_DOVI_DIR=${doviDir}", "-DVELA_ASS_DIR=${assDir}" }
    }
  }
  externalNativeBuild {
    cmake {
      path 'ffmpeg/CMakeLists.txt'
      buildStagingDirectory layout.buildDirectory.dir('cxx').get().asFile
    }
  }
  sourceSets.main.java.srcDirs += [new File(ffmpegDir, 'java')]
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.facebook.react:hermes-android'
  compileOnly 'org.checkerframework:checker-qual:3.13.0'
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-decoder:${media3Version}"
  // The app's media session and its foreground service (music, audiobooks, podcasts and full-screen video).
  implementation "androidx.media3:media3-session:${media3Version}"
}
