<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" preserveAspectRatio="none">
  <!-- Late Night: analogue snow. Static (no animation): the renderer's motion presets flash it. -->
  <filter id="snow" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.92 0.62" numOctaves="2" seed="7" result="grain"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.22" numOctaves="1" seed="2" result="streak"/>
    <feComposite in="grain" in2="streak" operator="arithmetic" k1="0" k2="1.25" k3="0.5" k4="-0.12"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.06 0.22 0.5 0.78 0.94 1"/>
      <feFuncG type="discrete" tableValues="0.06 0.22 0.5 0.78 0.94 1"/>
      <feFuncB type="discrete" tableValues="0.08 0.25 0.53 0.8 0.96 1"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="480" height="270" filter="url(#snow)"/>
</svg>
