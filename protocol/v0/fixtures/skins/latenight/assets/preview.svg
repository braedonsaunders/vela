<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Late Night picker preview: an old set in a dark room, tuned to Vela. Original artwork. -->
  <defs>
    <radialGradient id="room" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1a1a24"/><stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622"/><stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/><stop offset="0.55" stop-color="#b8456a"/><stop offset="1" stop-color="#f59a54"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffa1" stop-opacity="0.12"/><stop offset="1" stop-color="#7dffa1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000" fill-opacity="0.35"/></pattern>
    <clipPath id="screen"><rect x="260" y="150" width="1080" height="660" rx="64"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#room)"/>
  <ellipse cx="800" cy="480" rx="760" ry="460" fill="url(#glow)"/>
  <!-- cabinet -->
  <rect x="190" y="90" width="1220" height="800" rx="70" fill="url(#cab)"/>
  <rect x="200" y="100" width="1200" height="780" rx="64" fill="none" stroke="#3b3530" stroke-width="2"/>
  <rect x="240" y="130" width="1120" height="700" rx="76" fill="#050506"/>
  <g clip-path="url(#screen)">
    <rect x="260" y="150" width="1080" height="660" fill="#07080b"/>
    <!-- the picture -->
    <rect x="260" y="150" width="1080" height="420" fill="url(#sky)"/>
    <circle cx="1060" cy="420" r="96" fill="#ffd27a" fill-opacity="0.85"/>
    <path d="M260 470 L420 380 L560 450 L700 360 L860 470 L1010 400 L1160 470 L1340 390 V570 H260 Z" fill="#2a1630"/>
    <path d="M260 520 L480 450 L700 520 L940 460 L1180 530 L1340 480 V570 H260 Z" fill="#14091b"/>
    <rect x="260" y="150" width="1080" height="420" fill="#07080b" fill-opacity="0.18"/>
    <rect x="260" y="420" width="1080" height="160" fill="#07080b" fill-opacity="0.55"/>
    <!-- OSD -->
    <rect x="320" y="226" width="96" height="30" fill="#040608" fill-opacity="0.85"/>
    <text x="330" y="250" font-family="monospace" font-size="26" fill="#7dffa1">▶ PLAY</text>
    <rect x="320" y="272" width="440" height="58" fill="none"/>
    <text x="320" y="320" font-family="Verdana, sans-serif" font-weight="700" font-size="52" letter-spacing="2" fill="#f3eee0">MIDNIGHT</text>
    <text x="320" y="374" font-family="Verdana, sans-serif" font-weight="700" font-size="52" letter-spacing="2" fill="#f3eee0">DRIVE-IN</text>
    <rect x="320" y="408" width="140" height="44" rx="4" fill="#f3eee0"/>
    <text x="340" y="440" font-family="monospace" font-size="28" fill="#15120d">▶ PLAY</text>
    <rect x="474" y="408" width="104" height="44" rx="4" fill="#040608" stroke="#f3eee0" stroke-opacity="0.55" stroke-width="2"/>
    <text x="494" y="440" font-family="monospace" font-size="28" fill="#f3eee0">INFO</text>
    <text x="1170" y="236" font-family="monospace" font-size="54" fill="#7dffa1">CH 03</text>
    <!-- tape-label rows -->
    <g>
      <rect x="320" y="600" width="250" height="34" rx="2" fill="#efe7d2"/>
      <rect x="320" y="600" width="6" height="34" fill="#e8452c"/><rect x="326" y="600" width="6" height="34" fill="#f59a23"/><rect x="332" y="600" width="6" height="34" fill="#f4cf3a"/>
      <text x="352" y="625" font-family="'Marker Felt', 'Comic Sans MS', cursive" font-size="22" fill="#15120d">Late night picks</text>
      <rect x="320" y="650" width="120" height="180" rx="4" fill="#3d6e8a"/>
      <rect x="456" y="650" width="120" height="180" rx="4" fill="#8a3d4e"/>
      <rect x="592" y="650" width="120" height="180" rx="4" fill="#c8913a"/>
      <rect x="728" y="650" width="120" height="180" rx="4" fill="#2f5a3f"/>
      <rect x="864" y="650" width="120" height="180" rx="4" fill="#5b3d8a"/>
      <rect x="1000" y="650" width="120" height="180" rx="4" fill="#8a6a3d"/>
      <rect x="1136" y="650" width="120" height="180" rx="4" fill="#3d4a8a"/>
      <rect x="452" y="646" width="128" height="188" rx="6" fill="none" stroke="#f3eee0" stroke-width="3"/>
      <rect x="449" y="646" width="128" height="188" rx="6" fill="none" stroke="#ff2e63" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="455" y="646" width="128" height="188" rx="6" fill="none" stroke="#22e1ee" stroke-opacity="0.7" stroke-width="2"/>
    </g>
    <rect x="260" y="150" width="1080" height="660" fill="url(#scan)"/>
    <rect x="260" y="540" width="1080" height="26" fill="#e6f0ff" fill-opacity="0.08"/>
    <rect x="260" y="150" width="1080" height="660" fill="url(#vig)"/>
    <ellipse cx="520" cy="240" rx="360" ry="160" fill="#fff" fill-opacity="0.04"/>
  </g>
  <!-- controls -->
  <circle cx="1250" cy="856" r="10" fill="#7dffa1" fill-opacity="0.8"/>
  <rect x="1100" y="848" width="120" height="16" rx="3" fill="#0d0c0b"/>
  <svg x="296" y="838" width="104" height="40" viewBox="0 -43 489 186"><g transform="translate(0 -43) scale(3.75) translate(-9 -8)"><path d="M38 8H55L36.8 50.8 32.4 57.6Z" fill="#dcb998"/><path d="M9 8H26.4L41 57.6H32.4Z" fill="#f5f1e9"/></g><g transform="translate(242.75 0)"><g fill="none" stroke="#f5f1e9" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 36L26 100L52 36M72 68H136A32 32 0 1 0 128.51 88.57M156 0V100M240 68A32 32 0 1 0 176 68A32 32 0 1 0 240 68M240 36V100"/></g></g></svg>
</svg>
